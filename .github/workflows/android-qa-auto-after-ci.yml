name: Android QA Auto Build After CI

# Only a successful, merged main CI run can trigger a new phone build.
# GitHub pushes without an installable APK never generate update notices.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: ieventplux-android-qa-auto
  cancel-in-progress: false

jobs:
  dispatch-tested-native-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check native changes since the last published QA APK
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$CI_SHA" != ""
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$CI_SHA" ]; then
            echo "Superseded CI SHA; a later tested main commit will be considered."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A docs-only merge must not hide native changes in earlier commits.
          last="$(gh api --method GET "repos/$GITHUB_REPOSITORY/releases" -f per_page=100 --jq '[.[] | select(.draft==false and .prerelease==true and (.tag_name|test("^android-qa-[a-f0-9]{7,40}$")) and any(.assets[]; .name=="app-release.apk" and .size>10000000))] | sort_by(.published_at) | last | .tag_name // empty')"
          if bash scripts/android-qa-native-delta.sh "$CI_SHA" "$last"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" != 1 ]; then exit "$result"; fi
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch verified Android standalone APK build
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run android-debug-apk.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f standalone_qa=true -f diagnostics_only=false -f tested_sha="$CI_SHA"
          echo "Android QA build dispatched. Release is published only after APK verification."
