name: Android QA Auto Build After CI

# Only a successful, merged main CI run can trigger a new phone build.
# GitHub pushes without an installable APK never generate update notices.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: ieventplux-android-qa-auto
  cancel-in-progress: false

jobs:
  dispatch-tested-native-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed native source and latest main commit
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$CI_SHA" != ""
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$CI_SHA" ]; then
            echo "Superseded CI SHA; a later tested main commit will be considered."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CI_SHA" --jq '.files[]?.filename')"
          if printf '%s\n' "$changed" | grep -Eq '^(mobile/|\.github/workflows/android-debug-apk\.yml$)'; then
            short="${CI_SHA:0:7}"
            if gh release view "android-qa-$short" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Verified QA APK already published for this commit."
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Web/API-only change: no native update required."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch verified Android standalone APK build
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run android-debug-apk.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f standalone_qa=true -f diagnostics_only=false
          echo "Android QA build dispatched. Release is published only after APK verification."
