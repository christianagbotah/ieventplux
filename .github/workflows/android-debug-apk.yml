name: Android Installable Test APK

# Manual only: native Gradle builds consume compute and are not needed for web changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieventplux-android-debug
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build Android debug-signed test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Install Java 17 for Expo SDK 52
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Android SDK utilities and licenses
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK 35 and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;26.1.10909125"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Install exact mobile dependency lockfile
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Verify native tests and TypeScript
        working-directory: mobile
        run: |
          bun test
          bunx tsc --noEmit

      - name: Generate Android project from Expo
        working-directory: mobile
        run: |
          bunx expo prebuild --platform android --no-install --clean
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Compile and debug-sign installable APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          set -e
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android debug APK for authorized QA
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
