name: Android Installable Test APK

# Manual only: native Gradle builds consume compute and are not needed for web changes.
on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Only reproduce Expo native CMake/Prefab configuration (no APK)"
        required: false
        type: boolean
        default: false
      standalone_qa:
        description: "Standalone internal test APK with embedded JavaScript"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ieventplux-android-debug
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build Android debug-signed test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Install Java 17 for Expo SDK 52
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # GitHub Ubuntu hosted runners already include a working SDK manager.
      # Do not use setup-android@v3: in 2026 it attempts to install the removed
      # legacy "tools" SDK package and fails before Gradle can start.
      - name: Prepare hosted Android SDK 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install             "platforms;android-35" "build-tools;35.0.0"             "platform-tools" "ndk;26.1.10909125"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Install exact mobile dependency lockfile
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Verify native tests and TypeScript
        working-directory: mobile
        run: |
          bun test
          bunx tsc --noEmit

      - name: Generate Android project from Expo
        working-directory: mobile
        run: |
          bunx expo prebuild --platform android --no-install --clean
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Compile and debug-sign installable APK
        working-directory: mobile/android
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          set +e
          # Do not pollute Prefab stderr with JVM tool-option banners.
          # AGP 8.6 can misclassify them as CXX1210 native-library failures.
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          chmod +x ./gradlew
          if [ "${{ inputs.diagnostics_only }}" = "true" ]; then
            TASK=":expo-modules-core:configureCMakeDebug[arm64-v8a]"
          elif [ "${{ inputs.standalone_qa }}" = "true" ]; then
            # Release build embeds JavaScript. Test signing only, NOT Play Store.
            grep -q 'signingConfig signingConfigs.debug' app/build.gradle || exit 17
            TASK=":app:assembleRelease"
          else
            TASK=":app:assembleDebug"
          fi
          echo "Gradle target: $TASK"
          ./gradlew --no-daemon --max-workers=2 --info --stacktrace "$TASK" \
            > "$GITHUB_WORKSPACE/android-gradle-build.log" 2>&1
          result=$?
          tail -n 130 "$GITHUB_WORKSPACE/android-gradle-build.log"
          if [ "$result" -ne 0 ]; then
            echo "=== Native CMake and Prefab root-cause context ==="
            grep -in -C 10 -E 'CXX1210|No compatible library|NoMatchingLibraryException|Prefab|CMake Error|Build failed|Could not resolve' \
              "$GITHUB_WORKSPACE/android-gradle-build.log" | tail -n 200 || true
            echo "=== Versions of generated SDK/ABI configuration ==="
            grep -E '^(newArchEnabled|reactNativeArchitectures|hermesEnabled)=' gradle.properties || true
            find "$GITHUB_WORKSPACE/mobile/node_modules/expo-modules-core/android/.cxx" \
              -name '*log*' -type f -maxdepth 9 -print | head -n 12 || true
          fi
          exit "$result"

      - name: Preserve native Prefab command logs for root-cause diagnosis
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/mobile/node_modules/expo-modules-core/android"
          OUT="$GITHUB_WORKSPACE/android-native-prefab-diagnostics"
          mkdir -p "$OUT"
          {
            echo "==== Native build log files ===="
            find "$CORE/build/intermediates/cxx" "$CORE/.cxx" -type f \
              \( -name 'prefab_command*' -o -name '*stderr*' -o -name '*stdout*' \
                 -o -name '*command*.txt' -o -name 'CMakeCache.txt' -o -name '*.log' \) \
              2>/dev/null | head -n 80
            echo "==== Module ABI/Gradle flags ===="
            grep -E '^(newArchEnabled|reactNativeArchitectures|hermesEnabled)=' \
              "$GITHUB_WORKSPACE/mobile/android/gradle.properties" || true
          } > "$OUT/manifest.txt"
          if [ -d "$CORE/build/intermediates/cxx" ]; then
            (
              cd "$CORE"
              find build/intermediates/cxx .cxx -type f \
                \( -name 'prefab_command*' -o -name '*stderr*' -o -name '*stdout*' \
                   -o -name 'CMakeCache.txt' -o -name '*.log' \) -print0 2>/dev/null |
                tar --null -czf "$OUT/expo-cxx-logs.tar.gz" -T - 2>/dev/null
            ) || true
          fi
          echo "==== Prefab stderr content (if generated) ===="
          find "$CORE/build/intermediates/cxx" -type f \
            \( -name 'prefab_command.stderr' -o -name '*stderr.txt' \) \
            -exec sh -c 'echo "### $1"; tail -n 120 "$1"' _ {} \; \
            2>/dev/null | tail -n 240 || true

      - name: Upload native Prefab diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-prefab-logs
          path: android-native-prefab-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-gradle-diagnostics
          path: android-gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify signed APK and offline bundle for standalone QA
        if: ${{ !inputs.diagnostics_only }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.standalone_qa }}" = "true" ]; then
            APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"
            unzip -Z1 "$APK" | grep -F 'assets/index.android.bundle' > /dev/null
          else
            APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload standalone Android internal QA APK
        if: ${{ !inputs.diagnostics_only && inputs.standalone_qa }}
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-standalone-qa-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android debug APK for developers
        if: ${{ !inputs.diagnostics_only && !inputs.standalone_qa }}
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
