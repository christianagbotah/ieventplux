name: Android Installable Test APK

# Manual only: native Gradle builds consume compute and are not needed for web changes.
on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Only reproduce Expo native CMake/Prefab configuration (no APK)"
        required: false
        type: boolean
        default: false
      standalone_qa:
        description: "Standalone internal test APK with embedded JavaScript"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ieventplux-android-debug
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build Android debug-signed test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Install Java 17 for Expo SDK 52
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # GitHub Ubuntu hosted runners already include a working SDK manager.
      # Do not use setup-android@v3: in 2026 it attempts to install the removed
      # legacy "tools" SDK package and fails before Gradle can start.
      - name: Prepare hosted Android SDK 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install             "platforms;android-35" "build-tools;35.0.0"             "platform-tools" "ndk;26.1.10909125"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Install exact mobile dependency lockfile
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Verify native tests and TypeScript
        working-directory: mobile
        run: |
          bun test
          bunx tsc --noEmit

      - name: Stamp native QA build revision and time
        if: ${{ !inputs.diagnostics_only && inputs.standalone_qa }}
        working-directory: mobile
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const cp = require('node:child_process')
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'))
          config.expo.extra = {
            ...config.expo.extra,
            androidBuildRevision: cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(),
            androidBuiltAt: new Date().toISOString(),
          }
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2))
          NODE
          node -e "const c=require('./app.json').expo.extra; if(!/^[0-9a-f]{40}$/.test(c.androidBuildRevision)) process.exit(1); console.log('Android build revision:',c.androidBuildRevision.slice(0,10))"

      - name: Generate Android project from Expo
        working-directory: mobile
        run: |
          bunx expo prebuild --platform android --no-install --clean
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      # A fresh runner generates a DIFFERENT debug keystore every run. Without a
      # persistent QA identity Android rejects in-place upgrades (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # These secrets are protected in GitHub Actions and NEVER committed to git.
      - name: Restore persistent QA signing identity
        if: ${{ !inputs.diagnostics_only && inputs.standalone_qa }}
        shell: bash
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.IEVENTPLUX_QA_KEYSTORE_BASE64 }}
          QA_STORE_PASSWORD: ${{ secrets.IEVENTPLUX_QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.IEVENTPLUX_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.IEVENTPLUX_QA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in QA_KEYSTORE_BASE64 QA_STORE_PASSWORD QA_KEY_ALIAS QA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing protected Android QA signing secret: $name"
              exit 21
            fi
          done
          KEYSTORE="$RUNNER_TEMP/ieventplux-qa-release.p12"
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" \
            -storepass "$QA_STORE_PASSWORD" -alias "$QA_KEY_ALIAS" >/dev/null
          echo "IEV_QA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "IEV_QA_STORE_PASSWORD=$QA_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "IEV_QA_KEY_ALIAS=$QA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "IEV_QA_KEY_PASSWORD=$QA_KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PYGRADLE'
          from pathlib import Path
          import re
          path = Path('mobile/android/app/build.gradle')
          source = path.read_text()
          assert source.count('signingConfigs {') == 1, 'Unexpected generated Gradle signing config'
          qa = '''signingConfigs {
                qa {
                    storeFile file(System.getenv('IEV_QA_KEYSTORE_PATH'))
                    storePassword System.getenv('IEV_QA_STORE_PASSWORD')
                    keyAlias System.getenv('IEV_QA_KEY_ALIAS')
                    keyPassword System.getenv('IEV_QA_KEY_PASSWORD')
                }'''
          source = source.replace('signingConfigs {', qa, 1)
          # Expo SDK 52 emits comments between `release {` and its signing
          # line, so do not assume the signingConfig immediately follows `{`.
          # Scope the replacement to release inside buildTypes; leave the
          # debug build's signing identity unchanged.
          build_types = source.index('buildTypes {')
          release_block = source.index('release {', build_types)
          old_signing = 'signingConfig signingConfigs.debug'
          signing_line = source.find(old_signing, release_block)
          assert signing_line != -1 and signing_line - release_block < 1800, \
              'Could not find Expo generated release signing config'
          source = source[:signing_line] + 'signingConfig signingConfigs.qa' + \
              source[signing_line + len(old_signing):]
          path.write_text(source)
          PYGRADLE
          grep -F 'signingConfig signingConfigs.qa' mobile/android/app/build.gradle

      - name: Compile and debug-sign installable APK
        working-directory: mobile/android
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          set +e
          # Do not pollute Prefab stderr with JVM tool-option banners.
          # AGP 8.6 can misclassify them as CXX1210 native-library failures.
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          chmod +x ./gradlew
          if [ "${{ inputs.diagnostics_only }}" = "true" ]; then
            TASK=":expo-modules-core:configureCMakeDebug[arm64-v8a]"
          elif [ "${{ inputs.standalone_qa }}" = "true" ]; then
            # Release build embeds JavaScript. Test signing only, NOT Play Store.
            grep -q 'signingConfig signingConfigs.qa' app/build.gradle || exit 17
            TASK=":app:assembleRelease"
          else
            TASK=":app:assembleDebug"
          fi
          echo "Gradle target: $TASK"
          ./gradlew --no-daemon --max-workers=2 --info --stacktrace "$TASK" \
            > "$GITHUB_WORKSPACE/android-gradle-build.log" 2>&1
          result=$?
          tail -n 130 "$GITHUB_WORKSPACE/android-gradle-build.log"
          if [ "$result" -ne 0 ]; then
            echo "=== Native CMake and Prefab root-cause context ==="
            grep -in -C 10 -E 'CXX1210|No compatible library|NoMatchingLibraryException|Prefab|CMake Error|Build failed|Could not resolve' \
              "$GITHUB_WORKSPACE/android-gradle-build.log" | tail -n 200 || true
            echo "=== Versions of generated SDK/ABI configuration ==="
            grep -E '^(newArchEnabled|reactNativeArchitectures|hermesEnabled)=' gradle.properties || true
            find "$GITHUB_WORKSPACE/mobile/node_modules/expo-modules-core/android/.cxx" \
              -name '*log*' -type f -maxdepth 9 -print | head -n 12 || true
          fi
          exit "$result"

      - name: Preserve native Prefab command logs for root-cause diagnosis
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/mobile/node_modules/expo-modules-core/android"
          OUT="$GITHUB_WORKSPACE/android-native-prefab-diagnostics"
          mkdir -p "$OUT"
          {
            echo "==== Native build log files ===="
            find "$CORE/build/intermediates/cxx" "$CORE/.cxx" -type f \
              \( -name 'prefab_command*' -o -name '*stderr*' -o -name '*stdout*' \
                 -o -name '*command*.txt' -o -name 'CMakeCache.txt' -o -name '*.log' \) \
              2>/dev/null | head -n 80
            echo "==== Module ABI/Gradle flags ===="
            grep -E '^(newArchEnabled|reactNativeArchitectures|hermesEnabled)=' \
              "$GITHUB_WORKSPACE/mobile/android/gradle.properties" || true
          } > "$OUT/manifest.txt"
          if [ -d "$CORE/build/intermediates/cxx" ]; then
            (
              cd "$CORE"
              find build/intermediates/cxx .cxx -type f \
                \( -name 'prefab_command*' -o -name '*stderr*' -o -name '*stdout*' \
                   -o -name 'CMakeCache.txt' -o -name '*.log' \) -print0 2>/dev/null |
                tar --null -czf "$OUT/expo-cxx-logs.tar.gz" -T - 2>/dev/null
            ) || true
          fi
          echo "==== Prefab stderr content (if generated) ===="
          find "$CORE/build/intermediates/cxx" -type f \
            \( -name 'prefab_command.stderr' -o -name '*stderr.txt' \) \
            -exec sh -c 'echo "### $1"; tail -n 120 "$1"' _ {} \; \
            2>/dev/null | tail -n 240 || true

      - name: Upload native Prefab diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-prefab-logs
          path: android-native-prefab-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-gradle-diagnostics
          path: android-gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify signed APK and offline bundle for standalone QA
        if: ${{ !inputs.diagnostics_only }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.standalone_qa }}" = "true" ]; then
            APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"
            unzip -Z1 "$APK" | grep -F 'assets/index.android.bundle' > /dev/null
          else
            APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          if [ "${{ inputs.standalone_qa }}" = "true" ]; then
            # Public certificate fingerprint only; never print secret passwords or keys.
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | \
              grep -F 'Signer #1 certificate SHA-256 digest:'
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload standalone Android internal QA APK
        if: ${{ !inputs.diagnostics_only && inputs.standalone_qa }}
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-standalone-qa-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android debug APK for developers
        if: ${{ !inputs.diagnostics_only && !inputs.standalone_qa }}
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


  publish-qa-release:
    name: Publish verified Android QA APK prerelease
    needs: debug-apk
    # Only approved main builds receive write permission. Feature branch
    # workflow_dispatch builds can never publish a release.
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostics_only && inputs.standalone_qa && needs.debug-apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK from completed build job
        uses: actions/download-artifact@v4
        with:
          name: ieventplux-android-standalone-qa-apk
          path: qa-apk

      - name: Verify packaged JavaScript and publish immutable QA prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          TAG="android-qa-${SHA:0:7}"
          APK="qa-apk/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -F 'assets/index.android.bundle' > /dev/null
          sha256sum "$APK"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable QA release $TAG already exists; not replacing prior APK"
          else
            gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" --prerelease               --title "iEventPlux Android QA $TAG"               --notes "Test-signed Android QA build for commit $SHA. Not Google Play certified. Persistent QA signing identity starts with this build. Older test APKs may require one uninstall/reinstall due to the old ephemeral key; subsequent fixed-key releases support in-place updates. Device approval remains required. Camera, mic and native meetings still require physical-device testing."
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets             --jq '.assets[]|select(.name=="app-release.apk")|.url' |
            grep -F "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-release.apk"
          echo "Android QA APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-release.apk"
