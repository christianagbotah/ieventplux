name: Source-light release artifact (CI pilot)

# Produces a verified candidate bundle only. Never deploys, switches services,
# runs migrations, or enables ticket/merchandise charging.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-artifact.yml'
      - 'public/**'
      - 'next.config.*'
      - 'src/**'
      - 'mini-services/worker/**'
      - 'mini-services/realtime/**'
      - 'scripts/realtime-artifact-smoke.ts'
      - 'scripts/verify-worker-package.py'
      - 'prisma/**'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mini-services/worker/**'
      - 'mini-services/realtime/**'
      - 'scripts/realtime-artifact-smoke.ts'
      - 'scripts/verify-worker-package.py'
      - 'prisma/**'
      - 'public/**'
      - 'next.config.*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/release-artifact.yml'

permissions:
  contents: read

env:
  # Build the actual PR head commit, not GitHub's synthetic pull-request merge.
  CANDIDATE_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ieventplux-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieventplux_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ieventplux_ci
      APP_URL: http://127.0.0.1:3100
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PAYMENTS_SIMULATOR: auto
      SMS_SIMULATOR: auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source SHA and create ephemeral build-only secret
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          secret="$(openssl rand -hex 48)"
          echo "::add-mask::$secret"
          printf 'APP_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Locked install and Prisma client
        run: |
          bun install --frozen-lockfile
          bunx prisma generate
      - name: Typecheck and transaction security policies
        run: |
          bun run typecheck
          bun test src/server/hubtel/security-policy.test.ts src/portal/lib/checkin-policy.test.ts
      - name: Prepare disposable CI database only
        run: bunx prisma db push
      - name: Build immutable source-SHA candidate
        run: |
          bun run build
          test -f .next/standalone/server.js
          # Fail if the temporary CI secret was accidentally embedded in the
          # deployable server tree. Live secrets must be supplied at runtime.
          if grep -R -q -F -- "$APP_SECRET" .next/standalone; then
            echo "HOLD: build-only secret embedded in runtime bundle" >&2
            exit 1
          fi
          # Next.js standalone does not copy public/ or .next/static automatically.
          # Copy both into the runtime bundle before packaging, or static assets
          # would 404 even though server.js exists.
          test -d .next/static
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
      - name: Package minimum standalone runtime and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifact
          sha="${CANDIDATE_SOURCE_SHA}"
          printf '%s\n' "$sha" > dist-artifact/SOURCE_SHA
          printf '%s\n' "${GITHUB_RUN_ID}" > dist-artifact/CI_RUN_ID
          # Explicit runtime allowlist: never archive the complete tracing root.
          tar --exclude='.next/cache' -C .next/standalone -czf "dist-artifact/ieventplux-${sha}.tar.gz" server.js package.json node_modules .next public
          python3 scripts/verify-runtime-package.py "dist-artifact/ieventplux-${sha}.tar.gz"
          cd dist-artifact
          sha256sum "ieventplux-${sha}.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS
          du -h "ieventplux-${sha}.tar.gz"
      - name: Publish candidate with bounded retention
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-candidate-${{ env.CANDIDATE_SOURCE_SHA }}
          path: dist-artifact/
          retention-days: 7
          if-no-files-found: error

  build-worker-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieventplux_worker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ieventplux_worker_ci
      APP_URL: http://127.0.0.1:3100
      NODE_ENV: production
      PAYMENTS_SIMULATOR: auto
      SMS_SIMULATOR: auto
      WORKER_PORT: '3101'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify revision and initialize disposable schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          for key in APP_SECRET WORKER_SECRET REALTIME_SECRET; do
            value="$(openssl rand -hex 48)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          bun install --frozen-lockfile
          bunx prisma generate
          bunx prisma db push
      - name: Bundle worker with runtime-only Prisma files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-runtime/node_modules/@prisma worker-runtime/node_modules/.prisma
          bun build mini-services/worker/index.ts --target=bun --format=esm --external '@prisma/client' --external '@prisma/client/*' --outfile worker-runtime/worker.mjs
          cp -aL node_modules/@prisma/client worker-runtime/node_modules/@prisma/client
          cp -aL node_modules/.prisma/client worker-runtime/node_modules/.prisma/client
          for secret in "$APP_SECRET" "$WORKER_SECRET" "$REALTIME_SECRET"; do
            if grep -R -q -F -- "$secret" worker-runtime; then
              echo "HOLD: CI secret embedded in worker runtime" >&2
              exit 1
            fi
          done
          mkdir -p dist-worker
          printf '%s\n' "$CANDIDATE_SOURCE_SHA" > dist-worker/SOURCE_SHA
          printf '%s\n' "$GITHUB_RUN_ID" > dist-worker/CI_RUN_ID
          tar -C worker-runtime -czf "dist-worker/ieventplux-worker-$CANDIDATE_SOURCE_SHA.tar.gz" worker.mjs node_modules
          python3 scripts/verify-worker-package.py "dist-worker/ieventplux-worker-$CANDIDATE_SOURCE_SHA.tar.gz"
          (cd dist-worker && sha256sum "ieventplux-worker-$CANDIDATE_SOURCE_SHA.tar.gz" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Boot extracted runtime and exercise real job queue
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          tar -xzf "dist-worker/ieventplux-worker-$CANDIDATE_SOURCE_SHA.tar.gz" -C "$scratch"
          (
            cd "$scratch"
            exec bun worker.mjs
          ) > worker-artifact.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf -- "$scratch"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3101/health > /dev/null 2>&1; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          curl -fsS http://127.0.0.1:3101/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="healthy" and x["service"]=="ieventplux-worker"'
          for i in $(seq 1 30); do
            count="$(psql "$DATABASE_URL" -Atc "SELECT count(DISTINCT type) FROM \"OutboxJob\" WHERE status='DONE' AND type IN ('REMINDER_SWEEP','WAITLIST_SWEEP');")"
            if [ "$count" = 2 ]; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          test "$count" = 2
          echo WORKER_RUNTIME_QUEUE_SMOKE_PASSED
      - name: Upload worker diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-artifact-diagnostics
          path: worker-artifact.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish checksum-verified worker runtime
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-worker-candidate-${{ env.CANDIDATE_SOURCE_SHA }}
          path: dist-worker/
          retention-days: 7
          if-no-files-found: error

  build-realtime-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieventplux_realtime_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ieventplux_realtime_ci
      APP_URL: https://ci.example.invalid
      NODE_ENV: production
      PAYMENTS_SIMULATOR: auto
      SMS_SIMULATOR: auto
      REALTIME_PORT: '3103'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify revision and initialize disposable schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          for key in APP_SECRET WORKER_SECRET REALTIME_SECRET; do
            value="$(openssl rand -hex 48)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          bun install --frozen-lockfile
          (cd mini-services/realtime && bun install --frozen-lockfile)
          bunx prisma generate
          bunx prisma db push
      - name: Bundle realtime with runtime-only Prisma files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realtime-runtime/node_modules/@prisma realtime-runtime/node_modules/.prisma
          bun build mini-services/realtime/index.ts --target=bun --format=esm --external '@prisma/client' --external '@prisma/client/*' --outfile realtime-runtime/realtime.mjs
          cp -aL node_modules/@prisma/client realtime-runtime/node_modules/@prisma/client
          cp -aL node_modules/.prisma/client realtime-runtime/node_modules/.prisma/client
          for secret in "$APP_SECRET" "$WORKER_SECRET" "$REALTIME_SECRET"; do
            if grep -R -q -F -- "$secret" realtime-runtime; then
              echo "HOLD: CI secret embedded in realtime runtime" >&2
              exit 1
            fi
          done
          mkdir -p dist-realtime
          printf '%s\n' "$CANDIDATE_SOURCE_SHA" > dist-realtime/SOURCE_SHA
          printf '%s\n' "$GITHUB_RUN_ID" > dist-realtime/CI_RUN_ID
          tar -C realtime-runtime -czf "dist-realtime/ieventplux-realtime-$CANDIDATE_SOURCE_SHA.tar.gz" realtime.mjs node_modules
          python3 scripts/verify-worker-package.py "dist-realtime/ieventplux-realtime-$CANDIDATE_SOURCE_SHA.tar.gz" realtime.mjs
          (cd dist-realtime && sha256sum "ieventplux-realtime-$CANDIDATE_SOURCE_SHA.tar.gz" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Boot extracted runtime and exercise real socket access
        shell: bash
        env:
          IEVENTPLUX_ISOLATED_DB_TEST: "yes"
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          tar -xzf "dist-realtime/ieventplux-realtime-$CANDIDATE_SOURCE_SHA.tar.gz" -C "$scratch"
          (
            cd "$scratch"
            exec bun realtime.mjs
          ) > realtime-artifact.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf -- "$scratch"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3103/health > /dev/null 2>&1; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          curl -fsS http://127.0.0.1:3103/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="healthy" and x["service"]=="ieventplux-realtime"'
          bun run scripts/realtime-artifact-smoke.ts
      - name: Upload realtime diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-artifact-diagnostics
          path: realtime-artifact.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish checksum-verified realtime runtime
        uses: actions/upload-artifact@v4
        with:
          name: ieventplux-realtime-candidate-${{ env.CANDIDATE_SOURCE_SHA }}
          path: dist-realtime/
          retention-days: 7
          if-no-files-found: error
